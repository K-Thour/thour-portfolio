name: Test & Deploy Backend to Ubuntu Server

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run Backend Tests & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run Jest test suite
        run: npm test

  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: test
    environment: SERVER_HOST

    steps:
      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.SERVER_DEPLOY_PATH || '/home/ubuntu/thour-portfolio/Backend' }}"
            echo "Navigating to deploy path: $DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            REPO_ROOT="$(git rev-parse --show-toplevel 2>/dev/null || echo "$DEPLOY_PATH/..")"
            echo "Syncing from repo root: $REPO_ROOT"
            git -C "$REPO_ROOT" fetch origin main
            git -C "$REPO_ROOT" reset --hard origin/main
            chmod +x deploy-backend.sh
            ./deploy-backend.sh
